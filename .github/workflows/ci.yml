name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests (race detector, coverage)
        run: go test -race -count=1 -cover ./...
      - name: Build
        run: go build ./cmd/cometbft-archive
      - name: Verify the example archive against the genesis validator set
        run: >-
          go run ./cmd/cometbft-archive verify
          --car examples/synthos-mainnet-1/synthos-mainnet-1-000001-000100.car
          --genesis examples/synthos-mainnet-1/genesis-validators.json
